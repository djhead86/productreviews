baseURL = "https://kodiak-den.com"
languageCode = "en-us"
title = "Kodiak Den"
theme = "PaperMod"
[pagination]
  pagerSize = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[params]
  description = "Honest gear reviews for home studio producers, podcasters, and music makers — from someone who actually uses this stuff."
  author = "Dan"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = true
  TocOpen = false
  ShowWordCount = false
  comments = false
  hidemeta = false
  disableSpecial1stPost = false
  disableScrollToTop = false
  math = false

[params.homeInfoParams]
  Title = "Gear Reviews You Can Trust"
  Content = "I make music, host a podcast, and have spent way too much money on gear. Here's what's actually worth buying."

[params.profileMode]
  enabled = false

[params.label]
  text = "Kodiak Den"

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]
  [[menu.main]]
    identifier = "home-studio"
    name = "Home Studio"
    url = "/tags/home-studio/"
    weight = 10
  [[menu.main]]
    identifier = "podcasting"
    name = "Podcasting"
    url = "/tags/podcasting/"
    weight = 20
  [[menu.main]]
    identifier = "budget-picks"
    name = "Budget Picks"
    url = "/tags/budget/"
    weight = 30
  [[menu.main]]
    identifier = "comparisons"
    name = "Comparisons"
    url = "/tags/comparison/"
    weight = 40

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "monokai"

[minify]
  disableXML = true
  minifyOutput = true
