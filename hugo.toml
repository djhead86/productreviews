baseURL = "https://kodiak-den.com"
languageCode = "en-us"
title = "Kodiak Den"
theme = "PaperMod"
[pagination]
  pagerSize = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[params]
  description = "Gear reviews, security tools, and music experiments from the Arizona desert."
  author = "Dan"
  images = ["images/og-card.jpg"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = true
  TocOpen = false
  ShowWordCount = false
  comments = false
  hidemeta = false
  disableSpecial1stPost = false
  disableScrollToTop = false
  math = false

[params.profileMode]
  enabled = false

[params.label]
  text = "Kodiak Den"

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]
  [[menu.main]]
    identifier = "reviews"
    name = "Gear Reviews"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "music"
    name = "Music"
    url = "/music/"
    weight = 15
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20
  [[menu.main]]
    identifier = "rulattice"
    name = "Rulattice"
    url = "https://rulattice.kodiak-den.com/"
    weight = 30

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "monokai"

[minify]
  disableXML = true
  minifyOutput = true
