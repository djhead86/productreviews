<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07040d"/>
      <stop offset="0.35" stop-color="#1c0b24"/>
      <stop offset="0.62" stop-color="#4a1630"/>
      <stop offset="0.80" stop-color="#a3401f"/>
      <stop offset="0.92" stop-color="#d9772b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e2672a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e2672a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ffe2a6"/>
      <stop offset="0.7" stop-color="#f09a3e"/>
      <stop offset="1" stop-color="#b84a1c"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b5e4a"/>
      <stop offset="0.6" stop-color="#2f8f6b"/>
      <stop offset="1" stop-color="#0c2a22"/>
    </radialGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b2a1e"/>
      <stop offset="1" stop-color="#3a1418"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1418"/>
      <stop offset="1" stop-color="#1c0a12"/>
    </linearGradient>
    <linearGradient id="dune3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14070d"/>
      <stop offset="1" stop-color="#07030a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f3e6ff" opacity="0.7">
    <circle cx="120" cy="80" r="1.4"/><circle cx="260" cy="150" r="1"/><circle cx="410" cy="60" r="1.6"/>
    <circle cx="560" cy="130" r="1"/><circle cx="1010" cy="70" r="1.3"/><circle cx="1180" cy="140" r="1"/>
    <circle cx="1320" cy="55" r="1.7"/><circle cx="1470" cy="120" r="1.1"/><circle cx="700" cy="40" r="1"/>
    <circle cx="880" cy="110" r="0.9"/><circle cx="1540" cy="210" r="1.2"/><circle cx="60" cy="230" r="1"/>
  </g>

  <!-- the sun that is also an eye -->
  <g transform="translate(0,-130)">
  <circle cx="800" cy="520" r="420" fill="url(#glow)"/>
  <circle cx="800" cy="520" r="230" fill="url(#sun)"/>
  <path d="M600 520 Q800 380 1000 520 Q800 660 600 520 Z" fill="#f7ecd2" opacity="0.92"/>
  <circle cx="800" cy="520" r="78" fill="url(#iris)"/>
  <ellipse cx="800" cy="520" rx="14" ry="66" fill="#05080a"/>
  <circle cx="775" cy="492" r="9" fill="#fff" opacity="0.6"/>
  <path d="M600 520 Q800 380 1000 520" fill="none" stroke="#2a0f14" stroke-width="6" opacity="0.7"/>
  </g>

  <!-- tentacles rising behind the far dunes -->
  <g fill="#260b1c" opacity="0.92">
    <path d="M170 700 C150 560 250 470 220 360 C205 300 240 260 275 250 C245 300 270 340 285 400 C310 510 250 590 290 700 Z"/>
    <path d="M330 720 C350 620 300 560 330 480 C350 430 395 420 410 380 C420 440 380 470 375 530 C370 610 410 650 400 720 Z"/>
    <path d="M1240 710 C1270 590 1210 520 1250 420 C1275 360 1330 340 1350 290 C1365 360 1310 400 1305 470 C1295 570 1340 630 1320 710 Z"/>
    <path d="M1400 720 C1390 640 1440 590 1420 520 C1408 475 1440 440 1475 430 C1455 470 1470 505 1480 545 C1495 620 1450 670 1470 720 Z"/>
  </g>
  <g fill="none" stroke="#3d1226" stroke-width="3" opacity="0.6">
    <path d="M215 420 q14 4 18 -6 M232 480 q14 4 18 -6 M240 540 q14 4 18 -6"/>
    <path d="M1292 470 q14 4 18 -6 M1288 530 q14 4 18 -6 M1300 590 q14 4 18 -6"/>
  </g>

  <!-- dunes -->
  <path d="M0 690 C220 640 420 660 640 690 C860 720 1060 650 1300 660 C1440 666 1530 690 1600 700 L1600 900 L0 900 Z" fill="url(#dune1)"/>
  <path d="M0 760 C260 720 500 740 760 775 C1000 806 1220 740 1600 760 L1600 900 L0 900 Z" fill="url(#dune2)"/>
  <path d="M0 830 C300 800 600 815 900 840 C1150 860 1380 820 1600 830 L1600 900 L0 900 Z" fill="url(#dune3)"/>

  <!-- dead tree and a half-buried monolith -->
  <g fill="#0b0408">
    <path d="M1080 745 l6 -70 -22 -30 6 -2 20 26 4 -40 -18 -26 6 -3 15 22 5 -30 6 0 -4 40 20 -24 5 4 -26 32 -3 50 z"/>
    <path d="M470 780 l14 -96 30 -6 6 104 z"/>
  </g>
</svg>
