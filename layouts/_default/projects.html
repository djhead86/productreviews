{{- define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}<div class="post-description">{{ . | markdownify }}</div>{{ end }}
</header>

{{- with .Content }}<div class="post-content">{{ . }}</div>{{ end }}

<div class="kd-project-grid kd-project-grid--full">
  {{- range site.Data.projects }}
    {{- partial "project-card.html" . }}
  {{- end }}
</div>
{{- end }}
