# Project cards for /projects/ and the homepage.
# status: live | public | soon
#   live   = has a site you can visit (url)
#   public = public GitHub repo (repo)
#   soon   = private for now; card shows "Coming soon" and no link
# To publish a project later: flip status to public and add repo.

- name: Rulattice
  tagline: Security query translator
  description: Translates detection queries between KQL, SPL, XQL, CQL and LogScale, and tells you exactly what it couldn't translate instead of guessing.
  tags: [security, detection, typescript]
  status: live
  url: https://rulattice.kodiak-den.com/

- name: Did It Fire
  tagline: Detection validation
  description: Adversary emulation meets detection validation. Run the attack, then prove whether the detection actually fired.
  tags: [security, purple-team]
  status: public
  repo: https://github.com/djhead86/did-it-fire

