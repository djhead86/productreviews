# Project cards for /projects/ and the homepage.
# status: live | public | soon
# page: optional project page on this site (shown as the main button)
#   live   = has a site you can visit (url)
#   public = public GitHub repo (repo)
#   soon   = private for now; card shows "Coming soon" and no link
# To publish a project later: flip status to public and add repo.

- name: Rulattice
  tagline: Security query translator
  description: Translates detection queries between KQL, SPL, XQL, CQL and LogScale, including Cortex event classes and computed fields, and tells you exactly what it couldn't translate instead of guessing.
  tags: [security, detection, typescript]
  status: live
  url: https://rulattice.kodiak-den.com/
  page: /projects/rulattice/

- name: Bass Woodshed
  tagline: Metronome + neck map for bass
  description: An odd-meter metronome with accent groupings, subdivisions and a speed trainer, plus a 4, 5 and 6 string neck map for scales, modes, diatonic chord overlays, arpeggios and box positions. One page, nothing to install.
  tags: [music, bass, practice, javascript]
  status: live
  url: https://djhead86.github.io/kodiak-woodshed/
  repo: https://github.com/djhead86/kodiak-woodshed
  page: /projects/woodshed/

